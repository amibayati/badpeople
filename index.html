<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .dark-gradient-bg {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-gray-900">

    <!-- Header -->
    <div class="dark-gradient-bg text-gray-200 py-12 px-4">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-4xl font-bold mb-3 text-gray-100">لیست افراد</h1>
            <p class="text-lg opacity-70">جستجو و مشاهده اطلاعات</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto px-4 -mt-6">
        
        <!-- Search Bar -->
        <div class="mb-10">
            <div class="relative max-w-xl mx-auto">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="searchInput" 
                    class="w-full pl-12 pr-5 py-3 text-base rounded-lg shadow-lg border border-gray-700 focus:border-gray-600 focus:outline-none transition-all bg-gray-800 text-gray-200 placeholder-gray-500" 
                    placeholder="جستجو بر اساس نام...">
            </div>
        </div>

        <!-- Profile Grid -->
        <div id="profileGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-16">
            
            <!-- Card 1 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=1" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">علی محمدی</h3>
                        <p class="text-gray-500 text-xs">توسعه‌دهنده</p>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=5" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">سارا احمدی</h3>
                        <p class="text-gray-500 text-xs">طراح</p>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=12" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">رضا کریمی</h3>
                        <p class="text-gray-500 text-xs">مدیر پروژه</p>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=9" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">مریم حسینی</h3>
                        <p class="text-gray-500 text-xs">تحلیلگر</p>
                    </div>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=13" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">امیر رضایی</h3>
                        <p class="text-gray-500 text-xs">مهندس</p>
                    </div>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=10" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">فاطمه نوری</h3>
                        <p class="text-gray-500 text-xs">بازاریاب</p>
                    </div>
                </div>
            </div>

            <!-- Card 7 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=14" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">حسین جعفری</h3>
                        <p class="text-gray-500 text-xs">مدیر</p>
                    </div>
                </div>
            </div>

            <!-- Card 8 -->
            <div class="profile-card card-hover bg-gray-800 rounded-xl shadow-md overflow-hidden border border-gray-700">
                <div class="relative h-24 bg-gray-700"></div>
                <div class="relative px-3 pb-3">
                    <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                        <img src="https://i.pravatar.cc/100?img=16" alt="Profile" class="profile-image w-20 h-20 rounded-full border-2 border-gray-800 shadow-lg object-cover">
                    </div>
                    <div class="pt-12 text-center">
                        <h3 class="profile-name text-base font-semibold text-gray-200 mb-1">زهرا مرادی</h3>
                        <p class="text-gray-500 text-xs">طراح</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-16">
            <svg class="w-20 h-20 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-gray-500 text-lg">هیچ پروفایلی یافت نشد</p>
        </div>

    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const cards = document.querySelectorAll('.profile-card');
        const noResults = document.getElementById('noResults');
        const profileGrid = document.getElementById('profileGrid');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            let visibleCount = 0;

            cards.forEach(card => {
                const name = card.querySelector('.profile-name').textContent.toLowerCase();
                
                if (name.includes(searchTerm)) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                profileGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                profileGrid.classList.remove('hidden');
                noResults.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
